<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Bài viết')}"></head>
<body>
<div th:replace="~{layout/base :: header}"></div>
<main class="container" style="max-width: 600px;">
    <h1>Bài viết</h1>
    <form method="post"
          th:action="${articleId} != null ? @{/admin/articles/{id}(id=${articleId})} : @{/admin/articles}"
          th:object="${articleForm}">
        <div class="mb-3">
            <label for="title" class="form-label">Tiêu đề</label>
            <input type="text" class="form-control" id="title" th:field="*{title}">
            <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
        </div>
        <div class="mb-3" th:if="${publishedDate} != null">
            <label class="form-label">Ngày xuất bản</label>
            <p class="form-control-plaintext" th:text="${publishedDate}"></p>
        </div>
        <div class="mb-3">
            <label for="content" class="form-label">Nội dung</label>
            <textarea class="form-control" id="content" rows="12" th:field="*{content}"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Lưu</button>
    </form>
</main>
<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
