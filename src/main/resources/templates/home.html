<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/base :: head('Personal Blog')}"></head>
<body>
<div th:replace="~{layout/base :: header}"></div>
<main class="container">
    <h1 class="mb-4">Bài viết</h1>
    <p class="text-muted" th:if="${#lists.isEmpty(articles)}">Chưa có bài viết nào được xuất bản.</p>
    <ul th:unless="${#lists.isEmpty(articles)}" class="list-unstyled">
        <li th:each="article : ${articles}" class="mb-3 pb-3 border-bottom">
            <a class="fs-5 text-decoration-none" th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}"></a>
            <div class="text-muted small" th:text="${article.publishedDate}"></div>
        </li>
    </ul>
</main>
<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
