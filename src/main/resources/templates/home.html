<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Personal Blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{layout/base :: header}"></div>
<main class="container">
    <h1>Bài viết</h1>
    <p th:if="${#lists.isEmpty(articles)}">Chưa có bài viết nào được xuất bản.</p>
    <ul th:unless="${#lists.isEmpty(articles)}" class="list-unstyled">
        <li th:each="article : ${articles}" class="mb-3">
            <a th:href="@{/article/{id}(id=${article.id})}" th:text="${article.title}"></a>
            <div class="text-muted" th:text="${article.publishedDate}"></div>
        </li>
    </ul>
</main>
</body>
</html>
